 const bar=document.querySelector('.statusbar');clearMattingProgress(bar);bar.classList.add('matting-running');

  return await new Promise((resolve,reject)=>{
   let settled=false;const finish=(error,result)=>{if(settled)return;settled=true;clearTimeout(timer);error?reject(error):resolve(result);};

   worker.postMessage({pixels:pixels.buffer,width,height,options},[pixels.buffer]);

    card.style.top=Math.max(8,Math.min(innerHeight-card.offsetHeight-8,r.bottom+6))+'px';
    activeMenu=card;
  }
  function scheduleHide(){
    clearTimeout(leaveTimer);leaveTimer=setTimeout(()=>{
      if(!host.matches(':hover')&&!host.contains(document.activeElement))hideSettings();
    },160);
  }
  host.addEventListener('mouseenter',showSettings);
  host.addEventListener('mouseleave',scheduleHide);
  host.addEventListener('focusout',scheduleHide);
  trigger.addEventListener('focus',showSettings);
  trigger.onclick=showSettings;
  host.addEventListener('keydown',e=>{
    e.stopPropagation();
    if(e.key==='Escape'){e.preventDefault();trigger.focus({preventScroll:true});hideSettings();}
  });
  $('export-views').onclick=()=>{S.exportViews=!S.exportViews;syncExportSettings();};
  $('export-original-views').onclick=()=>{if(!S.exportViews)return;S.exportOriginalViews=!S.exportOriginalViews;syncExportSettings();};
  window.addEventListener('resize',()=>{if(card.classList.contains('open'))showSettings();});
  syncExportSettings();
};

async function viewOriginalBlob(layer){
  let data=layer.sourceData;
  if(!data){
    const item=[...(catalog?.candidates||[]),...(catalog?.current||[])].find(item=>item.id===layer.candidateId);
    data=item?await fileData(item):layer.original;
  }
  if(typeof data!=='string'||!/^data:image\//.test(data))throw new Error('未找到该视角的原始图片。');
  const response=await fetch(data);
  if(!response.ok)throw new Error('无法读取原始图片。');
  return response.blob();
}
function originalImageExtension(blob){
  return {'image/png':'png','image/jpeg':'jpg','image/webp':'webp','image/avif':'avif','image/gif':'gif','image/bmp':'bmp','image/x-ms-bmp':'bmp','image/tiff':'tif','image/svg+xml':'svg'}[blob.type.toLowerCase()]||'png';
}

/* Offline basic matting is independent of the neural-model connection. */
const selectionBeforeOfflineMatting=updateSelection;
updateSelection=function(){selectionBeforeOfflineMatting();syncBackendUI();};
clearMattingProgress();

/* Keep task ownership and undo history independent of selection changes. */
const refreshBeforeBackgroundMatting=refresh;
refresh=function(){observeMattingTarget();refreshBeforeBackgroundMatting();};
const projectBeforeBackgroundMatting=loadProject;
loadProject=async function(data,record=true){await projectBeforeBackgroundMatting(data,record);mattingProjectEpoch++;observeMattingTarget();};
const restoreBeforeBackgroundMatting=restoreOriginal;
restoreOriginal=async function(){if(!busy&&mattingJob&&selected()?.id===mattingJob.targetId)mattingJob.invalidated=true;await restoreBeforeBackgroundMatting();};
const selectionBeforeBackgroundMatting=updateSelection;
updateSelection=function(){selectionBeforeBackgroundMatting();if(mattingJob)$('remove-bg').disabled=true;const action=$('layer-context-menu')?.querySelector('[data-action="matte"]');if(action)action.disabled=busy||!!mattingJob;};

/* Reset only a double-click that started on the range thumb, not the track. */
function mattingParameterDefaults(method=S.method){
 return method==='basic'?{strength:26,feather:1.5}:{strength:50,feather:0};
}
function bindMattingParameterReset(id){
 const slider=$(id);
 let pressedOnThumb=false,firstPressOnThumb=false,secondPressOnThumb=false;
 function hitsThumb(e){
  if(slider.matches(':disabled'))return false;
  const rect=slider.getBoundingClientRect(),style=getComputedStyle(slider);
  // Matches the existing 13px thumb, including a small allowance for its ring.
  const thumbSize=13,min=Number(slider.min||0),max=Number(slider.max||100);
  const fraction=max>min?Math.max(0,Math.min(1,(Number(slider.value)-min)/(max-min))):0;
  const position=style.direction==='rtl'?1-fraction:fraction;
  const centerX=rect.left+thumbSize/2+position*Math.max(0,rect.width-thumbSize);
  return Math.hypot(e.clientX-centerX,e.clientY-(rect.top+rect.height/2))<=thumbSize/2+2;
 }
 // Capture before the browser moves the thumb in response to a track press.
 slider.addEventListener('pointerdown',e=>{pressedOnThumb=e.button===0&&e.isPrimary&&hitsThumb(e);},true);
 slider.addEventListener('mousedown',e=>{
  if(e.button!==0)return;
  if(e.detail===1){firstPressOnThumb=pressedOnThumb;secondPressOnThumb=false;}
  else if(e.detail===2)secondPressOnThumb=pressedOnThumb;
  else firstPressOnThumb=secondPressOnThumb=false;
 },true);
 slider.addEventListener('dblclick',e=>{
  const reset=e.button===0&&!slider.matches(':disabled')&&firstPressOnThumb&&secondPressOnThumb;
  firstPressOnThumb=secondPressOnThumb=false;
  if(!reset)return;
  e.preventDefault();
  slider.value=mattingParameterDefaults()[id];
  slider.dispatchEvent(new Event('input',{bubbles:true}));
  slider.dispatchEvent(new Event('change',{bubbles:true}));
 });
}
const bindBeforeMattingParameterReset=bind;
bind=function(){bindBeforeMattingParameterReset();for(const id of ['strength','feather'])bindMattingParameterReset(id);};

/* Optional canvas double-click locking reuses the existing undoable lock action. */
function bindDoubleClickLayerLock(){
 const wrap=$('stage-wrap');let presses=[];
 const modified=e=>e.shiftKey||e.ctrlKey||e.metaKey||e.altKey;
 const layerAt=e=>{const p=pointer(e);return [...S.layers].reverse().find(layer=>hit(layer,p));};
 wrap.addEventListener('pointerdown',e=>{
  const allowed=S.doubleClickLock&&!busy&&!pick&&!pan&&!spaceHeld&&e.button===0&&e.isPrimary&&!modified(e)&&!e.target.closest('.transform-handle');
  const layer=allowed?layerAt(e):null;
  if(!layer){presses=[];return;}
  presses=[...presses.slice(-1),{id:layer.id,pointerId:e.pointerId,x:e.clientX,y:e.clientY,moved:false}];
 },true);
 wrap.addEventListener('pointermove',e=>{
  const press=presses.at(-1);
  if(press&&press.pointerId===e.pointerId&&(e.buttons&1)&&Math.hypot(e.clientX-press.x,e.clientY-press.y)>3)press.moved=true;
 },true);
 wrap.addEventListener('pointercancel',()=>{presses=[];},true);
 wrap.addEventListener('dblclick',e=>{
  const [first,second]=presses;presses=[];
  if(!S.doubleClickLock||busy||pick||pan||spaceHeld||e.button!==0||modified(e)||e.target.closest('.transform-handle'))return;
  if(!first||!second||first.moved||second.moved||first.id!==second.id)return;
  const layer=layerAt(e);if(!layer||layer.id!==first.id)return;
  e.preventDefault();e.stopPropagation();closeMenus();hideTooltip();togglePositionLock(layer);
 });
 $('doubleclick-lock').onclick=()=>{S.doubleClickLock=!S.doubleClickLock;presses=[];syncExportSettings();};
 window.addEventListener('blur',()=>{presses=[];});
}
const bindBeforeDoubleClickLayerLock=bind;
bind=function(){bindBeforeDoubleClickLayerLock();bindDoubleClickLayerLock();};

/* A manual background color belongs to the currently selected source image. */
let backgroundColorImage=null;
const selectionBeforeAutomaticBackgroundColor=updateSelection;
updateSelection=function(){
  normalizeSelection();const layer=selected();
  const next=layer?{id:layer.id,original:layer.original,sourceData:layer.sourceData,candidateId:layer.candidateId}:null;
  const changed=next&&(!backgroundColorImage||Object.keys(next).some(key=>next[key]!==backgroundColorImage[key]));
  backgroundColorImage=next;
  if(changed){S.key=null;stopPicker();syncKey();}
  selectionBeforeAutomaticBackgroundColor();
};
